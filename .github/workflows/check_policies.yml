name: check-policies

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  check-formatting:
    # Skip draft pull requests; the workflow runs again once one is marked
    # ready for review.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install fprettify
      - name: Run fprettify
        id: fprettify-check
        run: |
          echo "Running fprettify..."
          FPRETTIFY_OUTPUT=$(fprettify --config .fprettify.ini --diff --recursive src 2>&1)
          echo "$FPRETTIFY_OUTPUT"
          {
            echo "fprettify_output<<EOF"
            echo "$FPRETTIFY_OUTPUT"
            echo "EOF"
          } >> $GITHUB_ENV
      - name: Check fprettify result
        if: env.fprettify_output != ''
        uses: actions/github-script@v7
        with:
          script: |
            core.setFailed('Code formatting issues found. Please run fprettify locally and commit the changes.')

  check-logging:
    # Terminal output and run-ending errors go through m_logger
    # (src/logger.f90) so they behave the same on one rank or many.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Look for print, error stop and terminal writes outside m_logger
        run: |
          matches=$(grep -rnIiE --include='*.f90' \
            '^[^!]*(\bprint\b|\berror +stop\b|\bwrite *\( *(\*|stdout|stderr|error_unit|output_unit|0|6) *[,)])' \
            src | grep -vE '^src/(logger|mpi)\.f90:' \
            | grep -v '! *logger-exempt' || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            echo "::error::Report through m_logger (log_info, log_warn, abort_run, ...) instead; see style.org."
            exit 1
          fi
