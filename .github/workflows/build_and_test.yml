name: Run unit tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/build_and_test.yml'

jobs:
  unit-tests:
    # Skip draft pull requests; the workflow runs again once one is marked
    # ready for review.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-22.04
    env:
      OMPI_VERSION: 4.1.5
      ADIOS2_VERSION: 2.10.2
    steps:

    - uses: actions/checkout@v4

    - name: Cache ADIOS2
      id: cache-adios2
      uses: actions/cache@v4
      with:
        path: ADIOS2-${{ env.ADIOS2_VERSION }}/installed
        key: ADIOS2-${{ env.ADIOS2_VERSION }}
    - name: Display GCC version number
      run: gcc --version

    - name: Install openmpi
      run: |
        sudo apt install  openmpi-bin libopenmpi-dev

    - name: Install MPI4PY
      run: |
        python -m pip install mpi4py

    - name: Build ADIOS2
      if: steps.cache-adios2.outputs.cache-hit != 'true'
      run: |
        wget https://github.com/ornladios/ADIOS2/archive/refs/tags/v${ADIOS2_VERSION}.tar.gz
        tar -xf v${ADIOS2_VERSION}.tar.gz
        cd ADIOS2-${ADIOS2_VERSION}/ && mkdir installed
        cmake -B $(pwd)/installed -DCMAKE_PREFIX_PATH=$(pwd)/installed -DADIOS2_USE_MPI=ON -DADIOS2_USE_Python=ON -DADIOS2_USE_Fortran=ON 
        make -C $(pwd)/installed 

    - name: Update ADIOS2 PATH
      run: |
        echo "$GITHUB_WORKSPACE/ADIOS2-${ADIOS2_VERSION}/installed/bin" \
          >> $GITHUB_PATH

    - name: Configure Debug build
      run: cmake -S . -B build-debug -DCMAKE_Fortran_COMPILER=mpif90 -DCMAKE_BUILD_TYPE=Debug -DWITH_ADIOS2=ON -DUSE_SYSTEM_ADIOS2=ON

    - name: Build test
      run: make -C build-debug

    - name: Run unit, verification and regression tests
      run:  ctest  --test-dir build-debug -L "unit|verification|regression" --output-on-failure

    - name: Configure Release build
      run: cmake -S . -B build -DCMAKE_Fortran_COMPILER=mpif90 -DCMAKE_BUILD_TYPE=Release -DWITH_ADIOS2=ON -DUSE_SYSTEM_ADIOS2=ON

    - name: Build tests
      run: make -C build

    - name: Run unit and verification tests
      run: ctest --test-dir build -L "unit|verification" --output-on-failure

    # WITH_MPI=OFF builds against the compiler itself rather than an MPI
    # wrapper, in its own build directory so that it does not inherit the MPI
    # cache written by the Release configure above.
    - name: Configure Release build (no mpi)
      run: cmake -S . -B build-no-mpi -DCMAKE_Fortran_COMPILER=gfortran -DCMAKE_BUILD_TYPE=Release -DWITH_MPI=OFF -DWITH_ADIOS2=ON -DUSE_SYSTEM_ADIOS2=ON

    - name: Build tests (no mpi)
      run: make -C build-no-mpi

    - name: Run unit and verification tests (no mpi)
      run: ctest --test-dir build-no-mpi -L "unit|verification" --output-on-failure

    - name: Configure Debug build (single precision)
      run: cmake -S . -B build-single-debug -DCMAKE_Fortran_COMPILER=mpif90 -DCMAKE_BUILD_TYPE=Debug -DSINGLE_PREC=ON -DWITH_ADIOS2=ON -DUSE_SYSTEM_ADIOS2=ON

    - name: Build tests (single precision)
      run: make -C build-single-debug

    - name: Run unit and verification tests (single precision)
      run: ctest --test-dir build-single-debug -L "unit|verification|regression" --output-on-failure

    - name: Configure Release build (single precision)
      run: cmake -S . -B build-single -DCMAKE_Fortran_COMPILER=mpif90 -DCMAKE_BUILD_TYPE=Release -DSINGLE_PREC=ON -DWITH_ADIOS2=ON -DUSE_SYSTEM_ADIOS2=ON

    - name: Build tests (single precision)
      run: make -C build-single

    - name: Run unit and verification tests (single precision)
      run: ctest --test-dir build-single -L "unit|verification" --output-on-failure

