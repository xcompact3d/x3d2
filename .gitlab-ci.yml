workflow:
  rules:
    # Run pipeline on tags for the main project
    - if: $CI_COMMIT_TAG && $CI_PROJECT_PATH == "xcompact3d/x3d2"
    # Run pipeline on the default branch for the main project
    #- if: $CI_COMMIT_BRANCH == "main" && $CI_PROJECT_PATH == "xcompact3d/x3d2"
    # Pipelines started by the GitHub Actions bridge
    # (.github/workflows/gitlab-ci-bridge.yml). It pushes the pull request head
    # to github-pr-<n> and starts the pipeline through the API, so the trigger
    # does not race the mirror update the way external_pull_request_event does.
    - if: $CI_PIPELINE_SOURCE == "api" && $GH_PR_NUMBER
    # Manual runs
    #- if: $CI_PIPELINE_SOURCE == "web"

stages:
  - build-and-test
  - check-policies

.build-and-test-template: &build-and-test-template
  image: ubuntu:24.04
  stage: build-and-test
  timeout: 1h
  script:
    - echo "Setup environment"
    # A dropped connection to the Ubuntu mirror fails the job with apt's exit
    # code 100 before anything is built. Retry each download a few times
    # instead, for every apt and apt-get call below.
    - echo 'Acquire::Retries "5";' > /etc/apt/apt.conf.d/80-retries
    - apt update
    - apt install -y environment-modules
    - echo "/apps/modules" >> /etc/environment-modules/modulespath
    - apt-get update
    - apt-get install -y ccache
    - apt-get install -y cmake
    - apt-get install -y gcc
    - apt-get install -y gfortran
    - apt-get install -y git
    - apt-get install -y infiniband-diags ibverbs-utils
    - apt-get install -y libibverbs-dev libfabric1 libfabric-dev libpsm2-dev
    - apt-get install -y openmpi-bin openmpi-common libopenmpi-dev libgtk2.0-dev
    - apt-get install -y librdmacm-dev libpsm2-dev
    - . /etc/profile.d/modules.sh
    - ccache -s && ccache -M 5G
    - if [ "${EXTRA_MODULE}" != "" ]; then module load ${EXTRA_MODULE}; fi
    - export OMPI_ALLOW_RUN_AS_ROOT=1
    - export OMPI_ALLOW_RUN_AS_ROOT_CONFIRM=1
    # FORTRAN_COMPILER is the MPI wrapper for an MPI build and the compiler
    # itself for a WITH_MPI=OFF one, where the wrapper would put MPI back on
    # the compile and link lines. Each job sets it.
    # The GPU runner is shared, and the same test can take 5 s in one job and
    # several minutes in the next. A test that runs past the timeout is
    # stopped and run once more, so a stall costs that test rather than the
    # whole 1 h job. The timeout is well above the slowest test seen in a
    # passing job (about 600 s on a busy runner). A test with its own TIMEOUT
    # property keeps it.
    - CTEST_ARGS="--output-on-failure --timeout 900 --repeat after-timeout:2"
    # The Debug pass reruns the unit and verification tests of the Release
    # pass, which is half the test time of a job. Pull request pipelines still
    # build Debug, to catch compile errors, but run its tests only on main,
    # on tags, in manual runs, or when DEBUG_TESTS=ON is set.
    - |
      RUN_DEBUG_TESTS=OFF
      if [ "${CI_COMMIT_BRANCH}" == "main" ] || [ -n "${CI_COMMIT_TAG}" ] \
         || [ "${CI_PIPELINE_SOURCE}" == "web" ] || [ "${DEBUG_TESTS}" == "ON" ]; then
        RUN_DEBUG_TESTS=ON
      fi
      echo "Debug tests: ${RUN_DEBUG_TESTS}"
    - echo "Configure Debug build"
    - cmake -S . -B build-debug -DCMAKE_Fortran_COMPILER=${FORTRAN_COMPILER} -DCMAKE_BUILD_TYPE=Debug -DENABLE_BACKEND=${ENABLE_BACKEND} -DBACKEND_ARCH=${BACKEND_ARCH} -DWITH_MPI=${WITH_MPI} -DWITH_ADIOS2=ON -DUSE_SYSTEM_ADIOS2=ON -DSINGLE_PREC=${SINGLE_PREC}
    - echo "Build tests"
    - make -j12 -C build-debug
    # The regression cases are the slow part of the suite, so they run once,
    # in the Release pass, which is the optimised build users run. Debug and
    # Release builds both match the goldens to the regression tolerances.
    # Unit and verification tests run in both passes when the Debug pass runs.
    - |
      if [ "${RUN_TEST}" == "ON" ] && [ "${RUN_DEBUG_TESTS}" == "ON" ]; then
        echo "Run the Debug tests"
        nvidia-smi || true
        ctest --test-dir build-debug -L "unit|verification" ${CTEST_ARGS} --output-junit ctest-junit.xml
      fi
    - echo "Configure Release build"
    - cmake -S . -B build -DCMAKE_Fortran_COMPILER=${FORTRAN_COMPILER} -DCMAKE_BUILD_TYPE=Release -DENABLE_BACKEND=${ENABLE_BACKEND} -DBACKEND_ARCH=${BACKEND_ARCH} -DWITH_MPI=${WITH_MPI} -DWITH_ADIOS2=ON -DUSE_SYSTEM_ADIOS2=ON -DSINGLE_PREC=${SINGLE_PREC}
    - echo "Build tests"
    - make -j12 -C build
    - |
      if [ "${RUN_TEST}" == "ON" ]; then
        echo "Run the Release tests"
        nvidia-smi || true
        nvidia-smi -q -d PERFORMANCE,CLOCK || true
        ctest --test-dir build -L "unit|verification|regression" ${CTEST_ARGS} --output-junit ctest-junit.xml
      fi
  # The GPU state at the end, also after a failure or a timeout: memory used
  # by other processes, utilisation, and why the clocks are held down (power,
  # thermal or applications clocks), which explains a slow job.
  after_script:
    - nvidia-smi || true
    - nvidia-smi -q -d PERFORMANCE,CLOCK || true
  # Surface individual test results in the pipeline's Tests tab. Without a
  # report GitLab shows "Tests 0" and a failing test is only visible by
  # scrolling the raw job log. ctest still sets the job's exit status, so this
  # is purely additive. Paths are relative to the build dir --output-junit was
  # given, so they sit inside build-debug/ and build/.
  artifacts:
    when: always
    expire_in: 1 month
    reports:
      junit:
        - build-debug/ctest-junit.xml
        - build/ctest-junit.xml
  tags:
    - gpu

.check-formatting-template: &check-formatting-template
  image: python:3.9.19-bullseye
  stage: check-policies
  variables:
    FPRETTIFY_COMMAND: fprettify --config .fprettify.ini --diff --recursive src
  before_script:
    - pip install fprettify
  script:
    - cd $CI_PROJECT_DIR
    - $FPRETTIFY_COMMAND &> fprettify.log
    - if [[ ! -z "$(cat fprettify.log)" ]]; then echo "::warning::Code formatting issues detected. See log for details."; exit 1; fi
  allow_failure: false
  timeout: 15m
  artifacts:
    expire_in: 1 month
    when: on_failure
    paths:
      - fprettify.log

