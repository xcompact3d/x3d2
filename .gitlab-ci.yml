build-and-test-cuda:
  <<: *build-and-test-template
  needs: []
  variables:
    ADIOS2_VERSION: 2.10.2
    EXTRA_MODULE: "adios2-nvfortran"
    SINGLE_PREC: "OFF"
    WITH_MPI: "ON"
    FORTRAN_COMPILER: "mpif90"
    ENABLE_BACKEND: "CUDA"
    BACKEND_ARCH: "cc86"
    RUN_TEST: "ON"

build-and-test-cuda-single-prec:
  <<: *build-and-test-template
  needs: ["build-and-test-cuda"]
  variables:
    ADIOS2_VERSION: 2.10.2
    EXTRA_MODULE: "adios2-nvfortran"
    SINGLE_PREC: "ON"
    WITH_MPI: "ON"
    FORTRAN_COMPILER: "mpif90"
    ENABLE_BACKEND: "CUDA"
    BACKEND_ARCH: "cc86"
    RUN_TEST: "ON"

